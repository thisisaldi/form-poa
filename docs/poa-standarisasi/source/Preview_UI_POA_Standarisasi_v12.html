<!--
  Struktur wizard 4-phase (lihat body lengkap di dokumen yang dilampirkan
  pengguna): Planning Standarisasi -> Approval Atasan -> Approval User/Dokter
  -> Finalisasi. Ringkasan komponen & tata letak per phase dituangkan ke
  ../03-ui-and-access.md (bukan disalin verbatim di sini untuk menghindari
  duplikasi ~500 baris CSS/HTML/JS yang sudah dianalisis).

  Elemen kunci yang dianalisis untuk spesifikasi:
  - .stepper: 4 langkah, klik-untuk-pindah hanya untuk step yang sudah "done"
  - screen-1 (Planning): outlet, KPDM+Jabatan, Tipe Standarisasi, Periode,
    Jumlah Bed RS, Target Penyelesaian, N kartu produk (dokter klinis di
    ujung tiap kartu), sidebar Data Survey/Produk Rekomendasi/Produk Sudah
    Terstandarisasi, blok Ringkasan POA (stat quad + tabel per produk)
  - screen-2 (Approval Atasan): status Menunggu untuk ASM & SM, TIDAK ada
    tombol approve/reject di wizard ini sendiri (ditandai "preview/placeholder"
    oleh penulis dokumen sumber)
  - screen-3 (Approval User/Dokter): checklist dokter per produk (checkbox
    "Sudah TTD"), grid dokumen NIE/CPOB/KFA/SP Non Sales (download-only),
    upload "Form Approval Standarisasi", sidebar navigasi produk
  - screen-4 (Finalisasi): readonly KPDM/Jabatan, upload "Surat Approval
    Standarisasi KFT", pilih Distributor, per produk: Finalisasi Biaya
    (Discount/Diskon Distributor/Biaya Listing) + tabel "Dokter yang Akan
    Menjadi User" (Jumlah Pasien & Resep per Pasien -> Estimasi Qty/Sales
    read-only, Entertain manual), lalu Ringkasan POA (sama dengan Planning)
-->
</body>
