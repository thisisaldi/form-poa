# This will set the replicaset count more information can be found here: https://kubernetes.io/docs/concepts/workloads/controllers/replicaset/
replicaCount: 1

# This sets the container image more information can be found here: https://kubernetes.io/docs/concepts/containers/images/
image:
  repository: draft
  # This sets the pull policy for images.
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: dev

# This is the contains environment variables
env: {}

# This section builds out the service account more information can be found here: https://kubernetes.io/docs/concepts/security/service-accounts/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Automatically mount a ServiceAccount's API credentials?
  automount: true
  # Annotations to add to the service account
  annotations:
    helm.sh/hook: pre-install
    helm.sh/hook-delete-policy: before-hook-creation
    helm.sh/hook-weight: "-1"
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: v-chc-pharmalogic-form-poa

# This is for setting Kubernetes Annotations to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}

# This is for setting Kubernetes Labels to a Pod.
# For more information checkout: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

podSecurityContext: {}
  # fsGroup: 2000

securityContext: {}
  # capabilities:
  #   drop:
  #   - ALL
  # readOnlyRootFilesystem: true
  # runAsNonRoot: true
  # runAsUser: 1000

# This is for setting up a service more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/
service:
  # This sets the service type more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#publishing-services-service-types
  type: ClusterIP
  # This sets the ports more information can be found here: https://kubernetes.io/docs/concepts/services-networking/service/#field-spec-ports
  internalPort: 3000
  externalPort: 80
  externalName: keda-add-ons-http-interceptor-proxy-clone.keda.svc.cluster.local

# This is for setting up an HTTPScaledObject more information can be found here: https://github.com/kedacore/http-add-on
httpScaledObject:
  enabled: true
  exposedHost: izmo.chc.pharmalink.id
  pathPrefixes:
    - /
  minReplicas: 0
  maxReplicas: 1
  scaledownPeriod: 14400

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 200m
    memory: 128Mi

# This is to setup the liveness and readiness probes more information can be found here: https://kubernetes.io/docs/tasks/configure-pod-container/configure-liveness-readiness-startup-probes/
probes:
  enabled: false
  path: /api/health
  liveness:
    initialDelaySeconds: 20
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1
  readiness:
    initialDelaySeconds: 10
    failureThreshold: 1
    periodSeconds: 10
    successThreshold: 1
    timeoutSeconds: 1

# This section is for setting up autoscaling more information can be found here: https://kubernetes.io/docs/concepts/workloads/autoscaling/
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 2
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

# Additional volumes on the output Deployment definition.
volumes: []
# - name: foo
#   secret:
#     secretName: mysecret
#     optional: false

# Additional volumeMounts on the output Deployment definition.
volumeMounts: []
# - name: foo
#   mountPath: "/etc/foo"
#   readOnly: true

# This is to setup vault with vault agent injector more information can be found here: https://www.vaultproject.io/docs/platform/k8s/injector
vault:
  authPath: auth/red-phoenix
  roleName: chc-pharmalogic-form-poa
  secretBasePath: env/data/century/form-poa
  kvVersion: 2
  tls:
    caCert: /vault/tls/tls.crt
    caKey: /vault/tls/tls.key
    secret: vault-ingress-tls
    serverName: vault.pharmalink.id
  agentInject:
    enabled: true
    initFirst: true
    prePopulateOnly: true
    secret: secret
    reRenderOnStatus: update
    revoke:
      enabled: true
      gracePeriodInSec: 20
    resources:
      requests:
        cpu: 10m
        memory: 20Mi
      limits:
        cpu: 20m
        memory: 40Mi

job:
  migrate:
    backoffLimit: 1
    restartPolicy: Never
    command: ["sh", "scripts/migrate.sh"]
    annotations:
      helm.sh/hook: pre-install,pre-upgrade
      helm.sh/hook-weight: "0"
      helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
    ttlSecondsAfterFinished: 120

tolerations:
  deployment:
    development:
      env: hc-intelligence
    staging:
      env: hc-intelligence
    production:
      env: healthyone
  cronjob:
    env: healthyone

terminationGracePeriodSeconds: 30
